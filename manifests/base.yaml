schema-version: 1
matrix-from-file: matrix.yaml
image:
  name: ghcr.io/sileader/rocm-images/base-ubuntu
  tags:
    - '26.04-rocm${{ matrix.rocm }}-${{ matrix.gfx }}'
base-image:
  name: ubuntu
  tag: '26.04'
  digest:
    linux/amd64: "sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
steps:
  - name: Install ROCm
    run: |
      apt-get update
      apt-get install -y --no-install-recommends wget gpg ca-certificates

      # Download and install GPG key
      mkdir --parents --mode=0755 /etc/apt/keyrings

      # ROCm release signing key
      wget https://stable.repo.amd.com/rocm/gpg/packages.gpg -O - | gpg --dearmor > /etc/apt/keyrings/amdrocm.gpg

      cat > /etc/apt/sources.list.d/amdrocm-stable.sources << EOF
      X-Repo-Id: amdrocm-stable
      Types: deb
      URIs: https://stable.repo.amd.com/rocm/core/packages/ubuntu2604/
      Suites: stable
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/amdrocm.gpg
      Enabled: yes
      EOF

      apt-get update
      apt-get install -y amdrocm${{ matrix.rocm }}-${{ matrix.gfx }}
      rm -rf /var/lib/apt/lists/*
