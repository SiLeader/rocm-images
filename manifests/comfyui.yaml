schema-version: 1
vars:
  comfy-version: v0.43.0
matrix-from-file: matrix.yaml
base-image:
  source: "./base.yaml"
  with-matrix: ${{ matrix }}
  use-from: true
image:
  name: ghcr.io/sileader/rocm-images/comfyui
  tags:
    - latest
    - '${{ vars.comfy-version }}-rocm${{ matrix.rocm }}-${{ matrix.gfx }}'
steps:
  - name: Workdir
    workdir: /opt/comfyui

  - name: Install
    run: |
      apt-get update
      apt-get install -y python3 python3-pip python3-venv git
      python3 -m venv /opt/comfyui/venv
      git clone -b '${{ vars.comfy-version }}' https://github.com/Comfy-Org/ComfyUI.git ComfyUI
      cd ComfyUI
      /opt/comfyui/venv/bin/python -m pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ "torch[device-${{ matrix.gfx }}]==2.14.0+rocm${{ matrix.rocm }}" "torchvision[device-${{ matrix.gfx }}]==0.29.0a0+rocm${{ matrix.rocm }}" "torchaudio==2.11.0.3+rocm${{ matrix.rocm }}"
      /opt/comfyui/venv/bin/python -m pip install -r requirements.txt
  
  - name: Change directory
    workdir: /opt/comfyui/ComfyUI

  - name: Set entrypoint
    entrypoint:
      - /opt/comfyui/venv/bin/python
      - main.py
