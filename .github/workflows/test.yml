name: Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: |
          command -v jq sha256sum
          uv run --locked python -m unittest discover -s tests -v
      - name: Validate image manifests and generate Dockerfiles
        run: |
          for manifest in manifests/base.yaml manifests/comfyui.yaml manifests/llama.cpp.yaml; do
            uv run --locked rocm-images generate-dockerfile "$manifest" \
              --output "${{ runner.temp }}/dockerfiles"
          done
