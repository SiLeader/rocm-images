name: Publish images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      gfx: ${{ steps.load.outputs.gfx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: load
        run: |
          gfx=$(yq -o=json -I=0 '.gfx' target.yaml)
          echo "gfx=$gfx" >> "$GITHUB_OUTPUT"

  publish-base-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs:
      - setup-matrix
    strategy:
      matrix:
        rocm:
          - "10.0"
          - "10.1"
        gfx: ${{ fromJSON(needs.setup-matrix.outputs.gfx) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base ubuntu
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./base
          file: ./base/Dockerfile
          push: true
          build-args: |
            ROCM_VERSION=${{ matrix.rocm }}
            GFX_TARGET=${{ matrix.gfx }}
          tags: ghcr.io/sileader/rocm-images/base-ubuntu:26.04-rocm${{ matrix.rocm }}-${{ matrix.gfx }}

  publish-comfyui:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs:
      - setup-matrix
      - publish-base-ubuntu
    strategy:
      matrix:
        rocm:
          - base: "10.0"
            pytorch: "10.0.0"
            torchvision: "0.29.0"

          - base: "10.1"
            pytorch: "10.1.0"
            torchvision: "0.29.0a0"
        gfx: ${{ fromJSON(needs.setup-matrix.outputs.gfx) }}
        comfy:
          - "v0.43.0"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push comfyui
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./comfyui
          file: ./comfyui/Dockerfile
          push: true
          build-args: |
            ROCM_VERSION=${{ matrix.rocm.base }}
            GFX_TARGET=${{ matrix.gfx }}
            PYTORCH_ROCM_VERSION=${{ matrix.rocm.pytorch }}
            TORCHVISION_VERSION=${{ matrix.rocm.torchvision }}
            COMFY_VERSION=${{ matrix.comfy }}
          tags: ghcr.io/sileader/rocm-images/comfyui:${{ matrix.comfy }}-rocm${{ matrix.rocm.base }}-${{ matrix.gfx }}

  publish-llama-cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs:
      - setup-matrix
      - publish-base-ubuntu
    strategy:
      matrix:
        rocm:
          - "10.0"
        gfx: ${{ fromJSON(needs.setup-matrix.outputs.gfx) }}
        llama_cpp:
          - "v0.8.0"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download llama.cpp prebuilt binaries
        run: |
          cd llama.cpp
          sudo bash download.sh "${{ matrix.llama_cpp }}" "${{ matrix.rocm }}"

      - name: Build and push llama-cpp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./llama.cpp
          file: ./llama.cpp/Dockerfile
          push: true
          build-args: |
            ROCM_VERSION=${{ matrix.rocm }}
            GFX_TARGET=${{ matrix.gfx }}
            LLAMA_CPP_VERSION=${{ matrix.llama_cpp }}
          tags: ghcr.io/sileader/rocm-images/llama.cpp:${{ matrix.llama_cpp }}-rocm${{ matrix.rocm }}-${{ matrix.gfx }}
