name: Publish images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      gfx: ${{ steps.load.outputs.gfx }}
      llama_cpp_download_matrix: ${{ steps.load.outputs.llama_cpp_download_matrix }}
      llama_cpp_build_matrix: ${{ steps.load.outputs.llama_cpp_build_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: load
        run: |
          gfx=$(yq -o=json -I=0 '.gfx' target.yaml)
          echo "gfx=$gfx" >> "$GITHUB_OUTPUT"
          llama_cpp_matrix='{
            "rocm": ["10.0"],
            "arch": ["amd64"],
            "llama_cpp": ["v0.8.0", "v0.9.0", "v1.0.0"]
          }'
          echo "llama_cpp_download_matrix=$(jq -c . <<< "$llama_cpp_matrix")" >> "$GITHUB_OUTPUT"
          echo "llama_cpp_build_matrix=$(jq -c --argjson gfx "$gfx" '. + {gfx: $gfx}' <<< "$llama_cpp_matrix")" >> "$GITHUB_OUTPUT"

  publish-base-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs:
      - setup-matrix
    strategy:
      matrix:
        rocm:
          - "10.0"
          - "10.1"
        gfx: ${{ fromJSON(needs.setup-matrix.outputs.gfx) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base ubuntu
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./base
          file: ./base/Dockerfile
          cache-to: type=gha,mode=max
          cache-from: type=gha,mode=max
          push: true
          build-args: |
            ROCM_VERSION=${{ matrix.rocm }}
            GFX_TARGET=${{ matrix.gfx }}
          tags: ghcr.io/sileader/rocm-images/base-ubuntu:26.04-rocm${{ matrix.rocm }}-${{ matrix.gfx }}

  publish-comfyui:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs:
      - setup-matrix
      - publish-base-ubuntu
    strategy:
      matrix:
        rocm:
          - base: "10.0"
            pytorch: "10.0.0"
            torchvision: "0.29.0"

          - base: "10.1"
            pytorch: "10.1.0"
            torchvision: "0.29.0a0"
        gfx: ${{ fromJSON(needs.setup-matrix.outputs.gfx) }}
        comfy:
          - "v0.43.0"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push comfyui
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./comfyui
          file: ./comfyui/Dockerfile
          cache-to: type=gha,mode=max
          cache-from: type=gha,mode=max
          push: true
          build-args: |
            ROCM_VERSION=${{ matrix.rocm.base }}
            GFX_TARGET=${{ matrix.gfx }}
            PYTORCH_ROCM_VERSION=${{ matrix.rocm.pytorch }}
            TORCHVISION_VERSION=${{ matrix.rocm.torchvision }}
            COMFY_VERSION=${{ matrix.comfy }}
          tags: ghcr.io/sileader/rocm-images/comfyui:${{ matrix.comfy }}-rocm${{ matrix.rocm.base }}-${{ matrix.gfx }}

  download-llama-cpp:
    runs-on: ubuntu-latest
    needs:
      - setup-matrix
    strategy:
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.llama_cpp_download_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download llama.cpp prebuilt binaries
        working-directory: ./llama.cpp
        run: |
          sudo bash download.sh "${{ matrix.llama_cpp }}" "${{ matrix.rocm }}"
          tar -czf "$RUNNER_TEMP/llama-cpp.tar.gz" llama.cpp

      - name: Upload llama.cpp prebuilt binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llama-cpp-${{ matrix.llama_cpp }}-rocm${{ matrix.rocm }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/llama-cpp.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish-llama-cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs:
      - setup-matrix
      - publish-base-ubuntu
      - download-llama-cpp
    strategy:
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.llama_cpp_build_matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download llama.cpp binary artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: llama-cpp-${{ matrix.llama_cpp }}-rocm${{ matrix.rocm }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/llama-cpp

      - name: Extract llama.cpp prebuilt binaries
        run: |
          tar -xzf "$RUNNER_TEMP/llama-cpp/llama-cpp.tar.gz" -C llama.cpp
          test -x llama.cpp/llama.cpp/llama-server

      - name: Build and push llama-cpp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./llama.cpp
          file: ./llama.cpp/Dockerfile
          platforms: linux/${{ matrix.arch }}
          cache-to: type=gha,mode=max
          cache-from: type=gha,mode=max
          push: true
          build-args: |
            ROCM_VERSION=${{ matrix.rocm }}
            GFX_TARGET=${{ matrix.gfx }}
            LLAMA_CPP_VERSION=${{ matrix.llama_cpp }}
          tags: ghcr.io/sileader/rocm-images/llama.cpp:${{ matrix.llama_cpp }}-rocm${{ matrix.rocm }}-${{ matrix.gfx }}
