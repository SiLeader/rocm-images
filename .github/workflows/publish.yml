name: Publish images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: |
          command -v jq sha256sum
          uv run --locked python -m unittest discover -s tests -v
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push all images
        run: >-
          uv run --locked rocm-images build
          manifests/base.yaml manifests/comfyui.yaml manifests/llama.cpp.yaml
          --output "${{ runner.temp }}/dockerfiles"
          --push
