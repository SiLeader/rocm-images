[project]
name = "rocm-images"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
rocm-images = "rocm_images:main"

[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
